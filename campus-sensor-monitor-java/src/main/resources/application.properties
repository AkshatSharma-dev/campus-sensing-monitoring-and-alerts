spring.application.name=campus-sensor-monitor
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campus_sensors}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:@Akshat195}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}

# Convenient for a local assignment. Use Flyway/Liquibase migrations in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
